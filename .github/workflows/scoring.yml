name: Check fantasy scoring
on:
  push:
    branches: [main, feature/admin-scoring-nov-2026]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: SQL scoring regression
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/sql_schema_fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/003_results_scoring.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/sql_scoring_regression.sql
